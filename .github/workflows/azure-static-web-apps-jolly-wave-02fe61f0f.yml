name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Step customizado: Compila os 3 MFEs + Host e agrega em host/dist/remotes/
      - name: Build All Microfrontends and Aggregate
        env:
          VITE_API_URL: "https://app-api-gateway-chamadas-fng7ehfuash3ckar.eastus2-01.azurewebsites.net"
        run: |
          cd frontend

          # 1. Compila os Microfrontends
          cd alunos && npm ci && npm run build && cd ..
          cd chamadas && npm ci && npm run build && cd ..
          cd registro-presenca && npm ci && npm run build && cd ..

          # 2. Compila o Host
          cd host && npm ci && npm run build && cd ..

          # 3. Cria a estrutura de pastas /remotes/ no dist do Host
          mkdir -p host/dist/remotes/alunos
          mkdir -p host/dist/remotes/chamadas
          mkdir -p host/dist/remotes/registro

          # 4. Copia a saída dos MFEs para dentro do dist do Host
          cp -r alunos/dist/* host/dist/remotes/alunos/
          cp -r chamadas/dist/* host/dist/remotes/chamadas/
          cp -r registro-presenca/dist/* host/dist/remotes/registro/

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_WAVE_02FE61F0F }}
          action: "upload"
          app_location: "./frontend/host/dist" # Aponta diretamente para a pasta final compilada
          api_location: ""
          output_location: ""                  # Fica vazio pois a app_location já é o dist
          skip_app_build: true                 # Mantém true para usar o build agregado anterior
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"